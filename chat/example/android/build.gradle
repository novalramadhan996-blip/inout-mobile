allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { project ->
    project.beforeEvaluate {
        if (project.name == 'flutter_app_badger' && project.hasProperty('android')) {
            project.android.namespace = 'fr.g123k.flutterappbadge'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
